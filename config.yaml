project:
  name: quant-factor-project
  random_seed: 42

data:
  provider: yfinance
  market: us_equity
  universe: us_large_cap_100
  universe_file: data/universe/us_large_cap_100.csv
  start_date: "2018-01-01"
  end_date: "2023-12-31"
  adjusted_price: auto
  raw_dir: data/raw
  processed_dir: data/processed
  request_timeout: 15
  request_retries: 3
  request_sleep_seconds: 0.5

filters:
  min_listing_days: 252
  exclude_st: true
  exclude_suspended: true

factors:
  momentum_window: 20
  reversal_window: 5
  volatility_window: 20
  moving_average_window: 20
  winsorize_method: mad
  winsorize_limit: 3.0
  standardize: true

evaluation:
  forward_return_days: 1
  ic_method: spearman
  quantile_groups: 5

backtest:
  factor: momentum
  rebalance_frequency: monthly
  portfolio_quantile: 0.2
  weighting: equal
  initial_cash: 1000000
  buy_commission_rate: 0.0003
  sell_commission_rate: 0.0003
  stamp_tax_rate: 0.0
  slippage_rate: 0.001
  benchmark: SPY

robustness:
  train_end_date: "2021-12-31"
  test_start_date: "2022-01-01"
  cost_multipliers:
    - 0.0
    - 0.5
    - 1.0
    - 2.0
    - 3.0
  momentum_windows:
    - 10
    - 20
    - 40
    - 60

diagnostics:
  # 阶段 17 因子诊断：在贴近月度策略的多个 horizon 上算 IC，避免只看 1 天尺度而误判因子。
  ic_horizons:
    - 1
    - 5
    - 21
  correlation_method: spearman

multi_factor:
  # 阶段 18 多因子综合分：sign 表示方向对齐后的符号（+1 保持、-1 翻转）。
  # 依据阶段 17 诊断：momentum/ma_deviation 21 天 IC 为负（短期反转区间），volatility 为正。
  # 剔除 ma_deviation（与 momentum 相关 0.83 冗余）。符号是研究判断，不在同一份数据上拟合。
  factors:
    momentum: -1
    reversal: 1
    volatility: 1
  # 阶段 19 严格版：推导因子符号时，用未来多少天的收益算 IC。用月度尺度(≈21天)匹配月度策略。
  sign_ic_horizon: 21

rolling_validation:
  train_years: 3
  test_years:
    - 2021
    - 2022
    - 2023
  selection_metric: sharpe_ratio
  momentum_windows:
    - 10
    - 20
    - 40
    - 60

output:
  results_dir: results
  figures_dir: results/figures
  reports_dir: results/reports
